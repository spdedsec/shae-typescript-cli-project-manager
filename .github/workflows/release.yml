name: release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run smoke tests
        run: make test

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: make build

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            shae-typescript-cli-project-manager ${{ github.ref_name }} (shae-pm)

            A command-line project manager in TypeScript: add, list, update
            status, and delete projects saved to JSON.

            ## Install

            ```bash
            ./scripts/install.sh
            ```

            ## Usage

            ```bash
            shae-pm add "website redesign" "refresh the site" todo
            shae-pm list
            shae-pm status <id> done
            shae-pm delete <id>
            ```
          generate_release_notes: false
